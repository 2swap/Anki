<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worksheet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root { --bg: #fafaf8; --card: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
          --full: #1f8a4c; --partial: #b7791f; --none: #c53030; --accent: #2b59c3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --card: #1f1f22; --ink: #ececec; --muted: #9a9aa0; --line: #333338;
            --full: #48bb78; --partial: #ecc94b; --none: #fc8181; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, sans-serif; }
  /* Like a chat: the threads are bottom-aligned, so each thread's current question sits on
     the same line at the bottom of the page and history grows upward. */
  main { max-width: 1500px; margin: 0 auto; padding: 56px 20px 48px; min-height: 100vh;
         display: grid; gap: 20px; align-items: end; align-content: end;
         /* A column is never narrower than its widest code line, so code doesn't scroll;
            the other columns shrink to make room. */
         grid-template-columns: repeat(3, minmax(min-content, 1fr)); }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); max-width: 680px; } }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
       padding: 16px 20px; margin-bottom: 16px; }
  /* A faint per-subject tint: the hue comes from a hash of the topic (subjectHue). */
  /* The outline is the card's own tint, a hair stronger, instead of a neutral gray. */
  .q[style*="--hue"] { background: hsl(var(--hue) 55% 96.25%); border-color: hsl(var(--hue) 45% 86.5%); }
  @media (prefers-color-scheme: dark) {
    .q[style*="--hue"] { background: hsl(var(--hue) 21% 14%); border-color: hsl(var(--hue) 24% 21%); }
  }
  .q.new { animation: fadein .4s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
  .topic { font-size: .75rem; color: var(--muted); margin-bottom: 6px; }
  .topic:empty { display: none; }
  .prompt > :first-child { margin-top: 0; }
  .prompt > :last-child { margin-bottom: 0; }
  .prompt pre { background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  code { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: .92em; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; width: 0; min-width: 4em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); color: var(--ink); font: inherit; }
  /* An application block: one row per item (label, answer box, mark), one Submit for all.
     Labels wrap past 60% of the width, so a long label never widens its whole column. */
  form.items { display: grid; grid-template-columns: fit-content(60%) minmax(6em, 1fr) 1.2em;
               gap: 6px 10px; align-items: center; }
  form.items .label > :first-child { margin: 0; }
  form.items input { width: auto; padding: 5px 8px; }
  form.items > button { grid-column: 1 / -1; justify-self: end; margin-top: 4px; }
  /* A rule between items, so a wrapped correction is clearly tied to its own item. */
  form.items .sep { grid-column: 1 / -1; border-top: 1px solid var(--line); }
  .q[style*="--hue"] form.items .sep { border-color: hsl(var(--hue) 30% 85%); }
  @media (prefers-color-scheme: dark) {
    .q[style*="--hue"] form.items .sep { border-color: hsl(var(--hue) 14% 26%); }
  }
  .mark { font-weight: 600; text-align: center; }
  .mark.full { color: var(--full); }
  .mark.partial { color: var(--partial); }
  .mark.none { color: var(--none); }
  input.full { border-color: var(--full); }
  input.partial { border-color: var(--partial); }
  input.none { border-color: var(--none); }
  .result { flex: 1; padding: 8px 0; overflow-wrap: anywhere; }
  form.items .result { padding: 5px 0; }
  .result .wrong { color: var(--none); }
  .result .right { color: var(--full); font-weight: 600; }
  button { padding: 8px 16px; border: 0; border-radius: 6px;
           background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.idk { background: var(--line); color: var(--ink); }
  .status { margin-top: 10px; }
  .status:empty { display: none; }
  .pending { color: var(--muted); font-style: italic; }
  .card:empty { display: none; }
  .card { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
          font-size: .9rem; color: var(--muted); }
  .card button { padding: 5px 12px; font-size: .85rem; }
  .card .label { color: var(--ink); }
  .card .done { color: var(--full); }
  .card .failed { color: var(--none); }
  .game:empty { display: none; }
  .game { margin-top: 12px; }
  .game iframe { width: 100%; height: 360px; border: 1px solid var(--line); border-radius: 6px;
                 display: block; background: transparent; color-scheme: normal; }
  .feedback p { display: inline; margin: 0; }
  .feedback.full { border-left: 3px solid var(--full); padding-left: 10px; }
  .feedback.partial { border-left: 3px solid var(--partial); padding-left: 10px; }
  .feedback.none { border-left: 3px solid var(--none); padding-left: 10px; }
  /* Follow-up questions on feedback: the student's question, then the tutor's reply. */
  .ask-q { margin-top: 10px; font-size: .9rem; color: var(--muted); }
  .ask-q::before { content: "You asked: "; font-style: italic; }
  .reply { margin-top: 4px; padding-left: 10px; border-left: 3px solid var(--line); }
  .reply p { display: inline; margin: 0; }
  .ask-btn { margin-left: 8px; padding: 1px 8px; font-size: .75rem; vertical-align: 1px;
             background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .ask-form { margin-top: 8px; }
  .ask-form[hidden] { display: none; }
  .ask-form input { font-size: .9rem; padding: 6px 8px; }
  .ask-form button { padding: 6px 12px; font-size: .85rem; }
  .ask-error { font-size: .85rem; color: var(--none); margin-top: 4px; }
  #offline { position: fixed; bottom: 12px; right: 12px; background: var(--none); color: #fff;
             padding: 6px 12px; border-radius: 6px; font-size: .85rem; display: none; }
  #loading { position: fixed; inset: 0; pointer-events: none;
             display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 20px; color: var(--muted); font-style: italic; text-align: center; }
  #loading[hidden] { display: none; }
  #loading .spinner { width: 18px; height: 18px; flex: none; border-radius: 50%;
                      border: 2px solid var(--line); border-top-color: var(--accent);
                      animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loading .spinner { animation: none; } }
  #suggest { position: fixed; top: 12px; right: 12px; z-index: 10;
             display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #suggest-toggle { padding: 6px 12px; font-size: .85rem; }
  #suggest-panel { width: min(360px, calc(100vw - 24px)); background: var(--card);
                   border: 1px solid var(--line); border-radius: 10px; padding: 12px;
                   box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  #suggest-panel[hidden] { display: none; }
  #suggest-panel form { flex-direction: column; margin-top: 0; }
  #suggest-panel textarea { width: 100%; min-height: 110px; resize: vertical; padding: 8px 10px;
                            border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
                            color: var(--ink); font: inherit; font-size: .9rem; }
  #suggest-panel button { align-self: flex-end; }
  #suggest-note { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
<div id="loading" role="status"><span class="spinner"></span>The tutor is writing your first questions…</div>
<main id="questions"></main>
<div id="suggest">
  <button id="suggest-toggle" type="button" aria-expanded="false" aria-controls="suggest-panel">Suggest</button>
  <div id="suggest-panel" hidden>
    <form id="suggest-form">
      <textarea id="suggest-text" maxlength="2000" aria-label="Suggestion for the tutor"
        placeholder="Type here to make suggestions to the tutor. For example, 'Please teach me Arabic!' or 'Within Biology, assume I am a complete beginner, and focus on phylogenetics.'"></textarea>
      <div id="suggest-note"></div>
      <button>Send</button>
    </form>
  </div>
</div>
<div id="offline">Can't reach tutor server</div>
<script>
const rendered = new Map();   // question id -> { el, sig }
const THREADS = [1, 2, 3];

function md(el, text, inline = false) {
  el.innerHTML = (inline ? marked.parseInline : marked.parse)(text || "");
  renderMathInElement(el, { delimiters: [
    { left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
    throwOnError: false });
}

// "spanish-language" -> "Spanish language": the notes file name the tutor puts in `topic`.
function subjectName(topic) {
  const words = String(topic || "").replace(/[-_]+/g, " ").trim();
  return words ? words[0].toUpperCase() + words.slice(1) : "";
}

// A stable hue (0-359) per subject, from an FNV-1a hash of its topic.
function subjectHue(topic) {
  let h = 2166136261;
  for (const ch of String(topic)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0) % 360;
}

// An application question: several items under one prompt, answered and submitted together.
const isBlock = q => Array.isArray(q.items);
const answerInputs = el => [...el.querySelectorAll("input.answer")];

function buildQuestion(q) {
  const el = document.createElement("section");
  el.className = "q new";
  el.innerHTML = `<div class="topic"></div>
                  <div class="prompt"></div>
                  <div class="game"></div>
                  <form class="answer-form"><button>Submit</button></form>
                  <div class="status"></div>
                  <div class="card"></div>`;
  el.querySelector(".topic").textContent = subjectName(q.topic);
  if (q.topic) el.style.setProperty("--hue", subjectHue(q.topic));
  md(el.querySelector(".prompt"), q.prompt);
  const form = el.querySelector("form");
  const btn = form.querySelector("button");
  const newInput = () => {
    const input = document.createElement("input");
    input.className = "answer";
    input.autocomplete = "off";
    input.addEventListener("input", () => syncButton(el));
    return input;
  };
  if (isBlock(q)) {
    form.classList.add("items");
    q.items.forEach((item, i) => {
      const label = document.createElement("label");
      label.className = "label";
      md(label, item.prompt, true);
      const input = newInput();
      input.id = `${q.id}-item${i}`;
      label.htmlFor = input.id;
      const mark = document.createElement("span");
      mark.className = "mark";
      if (i > 0) {
        const sep = document.createElement("div");
        sep.className = "sep";
        form.insertBefore(sep, btn);
      }
      form.insertBefore(label, btn);
      form.insertBefore(input, btn);
      form.insertBefore(mark, btn);
    });
    // Enter moves to the next box; Enter in the last box submits.
    const inputs = answerInputs(el);
    inputs.forEach((input, i) => input.addEventListener("keydown", e => {
      if (e.key === "Enter" && i < inputs.length - 1) { e.preventDefault(); inputs[i + 1].focus(); }
    }));
  } else {
    form.insertBefore(newInput(), btn);
  }
  form.addEventListener("submit", e => { e.preventDefault(); submit(q, el); });
  syncButton(el);
  return el;
}

const IDK = "I don't know";

// When every box is empty, "I don't know" replaces Submit; typing switches it back.
function syncButton(el) {
  const btn = el.querySelector("form.answer-form > button");
  const empty = answerInputs(el).every(i => !i.value.trim());
  btn.textContent = empty ? IDK : "Submit";
  btn.classList.toggle("idk", empty);
}

async function submit(q, el) {
  const values = answerInputs(el).map(i => i.value.trim() || IDK);
  const answer = isBlock(q) ? values : values[0];
  const btn = el.querySelector("form.answer-form > button");
  btn.disabled = true;
  const res = await fetch("/submit", { method: "POST", body: JSON.stringify({ id: q.id, answer }) });
  if (res.ok) btn.hidden = true;   // submitted: the button goes away
  else btn.disabled = false;
  poll();
}

const MARKS = { full: "✓", partial: "½", none: "✗" };

// Once graded, an answer box that didn't get full credit is replaced by the student's
// answer struck through in red, followed by the correct answer in green.
function showCorrection(input, given, credit, correct) {
  input.nextElementSibling?.classList.contains("result") && input.nextElementSibling.remove();
  input.hidden = false;
  if (!credit || credit === "full" || correct == null || correct === "") return;
  const result = document.createElement("span");
  result.className = "result";
  if (given && given !== IDK) {
    const wrong = document.createElement("s");
    wrong.className = "wrong";
    wrong.textContent = given;
    result.append(wrong, " ");
  }
  const right = document.createElement("span");
  right.className = "right";
  md(right, String(correct), true);
  result.append(right);
  input.hidden = true;
  input.after(result);
}

function updateStatus(q, el, answer, asks = [], entry = {}) {
  if (!answer) return;
  const inputs = answerInputs(el);
  const given = Array.isArray(answer.answer) ? answer.answer : [answer.answer];
  inputs.forEach((input, i) => {
    if (!input.value) input.value = given[i] ?? "";   // restore after a page reload
    input.disabled = true;
  });
  syncButton(el);
  el.querySelector("form.answer-form > button").hidden = true;
  if (isBlock(q)) {
    const marks = el.querySelectorAll("form.items .mark");
    q.items.forEach((item, i) => {
      const credit = MARKS[item.credit] ? item.credit : "";
      inputs[i].className = `answer ${credit}`;
      marks[i].className = `mark ${credit}`;
      marks[i].textContent = MARKS[credit] || "";
      showCorrection(inputs[i], given[i], credit, item.correct);
    });
  } else {
    showCorrection(inputs[0], given[0], q.credit, q.correct);
  }

  const status = el.querySelector(".status");
  if (!q.credit) {
    status.innerHTML = `<div class="pending">Grading…</div>`;
    return;
  }
  status.innerHTML = `<div class="feedback ${q.credit}"></div>`;
  let last = status.firstChild;   // the tutor's latest text, where the Ask button goes
  md(last, q.feedback);
  let waiting = false;
  for (const a of asks) {
    const ask = document.createElement("div");
    ask.className = "ask-q";
    ask.textContent = a.text;
    status.append(ask);
    const reply = (q.replies || {})[a.id];
    const box = document.createElement("div");
    if (reply == null) {
      box.className = "pending";
      box.textContent = "Thinking…";
      waiting = true;
    } else {
      box.className = "reply";
      md(box, reply);
      last = box;
    }
    status.append(box);
  }
  if (!waiting) addAsk(q, status, last, entry);
}

// The "Ask" button at the end of the tutor's latest text, and the one-line form it opens.
function addAsk(q, status, last, entry) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "ask-btn";
  btn.textContent = "Ask";
  btn.title = "Ask the tutor about this explanation";
  const tail = last.lastElementChild;
  (tail && tail.tagName === "P" ? tail : last).append(btn);

  const form = document.createElement("form");
  form.className = "ask-form";
  form.innerHTML = `<input autocomplete="off" maxlength="1000" placeholder="Ask about this explanation…"><button>Send</button>`;
  const input = form.querySelector("input");
  input.value = entry.askDraft || "";
  input.addEventListener("input", () => { entry.askDraft = input.value; });
  input.addEventListener("keydown", e => { if (e.key === "Escape") { entry.askOpen = false; form.hidden = true; } });
  form.hidden = !entry.askOpen;
  const error = document.createElement("div");
  error.className = "ask-error";
  status.append(form, error);

  btn.addEventListener("click", () => {
    entry.askOpen = form.hidden;
    form.hidden = !form.hidden;
    if (!form.hidden) input.focus();
  });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    const send = form.querySelector("button");
    send.disabled = true;
    error.textContent = "";
    try {
      const res = await fetch("/ask", { method: "POST", body: JSON.stringify({ id: q.id, text }) });
      if (!res.ok) throw new Error((await res.json()).error);
      entry.askDraft = "";
      entry.askOpen = false;
      poll();
    } catch (err) {
      send.disabled = false;
      error.textContent = `Couldn't send: ${err.message || "server unreachable"}`;
    }
  });
}

// An Anki card proposal on a graded question. The tutor names the deck and what the
// cards are about; their contents are only written after "Add to Anki" is clicked.
function updateCard(q, el, card) {
  const box = el.querySelector(".card");
  const p = q.card_proposal;
  if (!p || !q.credit) { box.innerHTML = ""; return; }
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = `Anki · ${p.deck}: ${p.label}`;
  box.replaceChildren(label);
  const note = text => { const s = document.createElement("span"); s.textContent = text; box.append(s); return s; };
  if (!card) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Add to Anki";
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        const res = await fetch("/cards/accept", { method: "POST", body: JSON.stringify({ id: q.id }) });
        if (!res.ok) throw new Error((await res.json()).error);
        poll();
      } catch (e) {
        btn.disabled = false;
        note(`Couldn't add: ${e.message || "server unreachable"}`).className = "failed";
      }
    });
    box.append(btn);
  } else if (card.state === "writing") note("Writing cards…").className = "pending";
  else if (card.state === "adding") note("Adding to Anki…").className = "pending";
  else note(card.summary).className = card.state === "done" ? "done" : "failed";
}

// A minigame the tutor wrote for this question, in a sandboxed frame: its code runs with an
// opaque origin and no network, and talks to this page only through postMessage.
const MAX_GAME_HEIGHT = 900;

function updateGame(q, el, version) {
  const box = el.querySelector(".game");
  if (version === "dropped") {
    box.innerHTML = "";   // failed twice; the question stands on its own
  } else if (version) {
    const frame = document.createElement("iframe");
    frame.sandbox = "allow-scripts";
    frame.title = "Minigame";
    frame.src = `/games/${encodeURIComponent(q.id)}.html?v=${version}`;
    frame.dataset.id = q.id;
    frame.dataset.version = version;
    box.replaceChildren(frame);
  } else if (q.game && !q.credit) {
    box.innerHTML = `<div class="pending">Building a minigame…</div>`;
  } else {
    box.innerHTML = "";
  }
}

addEventListener("message", e => {
  const frame = [...document.querySelectorAll(".game iframe")].find(f => f.contentWindow === e.source);
  const msg = e.data;
  if (!frame || !msg || msg.game !== true) return;
  if (msg.type === "height") {
    const h = Math.min(MAX_GAME_HEIGHT, Math.max(60, Number(msg.height) || 0));
    frame.style.height = `${h + 2}px`;
  } else if (msg.type === "error" || msg.type === "solved") {
    fetch("/games/event", { method: "POST", body: JSON.stringify({
      id: frame.dataset.id, version: frame.dataset.version, type: msg.type,
      detail: String(msg.type === "error" ? msg.error : msg.detail).slice(0, 500) }) }).catch(() => {});
  }
});

let firstRender = true;

function render({ worksheet, answers, asks = [], cards = {}, games = {} }) {
  // Stay pinned to the bottom (the current questions) unless the student scrolled up.
  const root = document.documentElement;
  const atBottom = firstRender || innerHeight + scrollY >= root.scrollHeight - 150;
  // Shown from page load until the tutor has posted its first question.
  document.getElementById("loading").hidden = (worksheet.questions || []).length > 0;
  const main = document.getElementById("questions");
  if (!main.children.length) {
    for (const t of THREADS) {
      const col = document.createElement("div");
      col.className = "thread";
      col.dataset.thread = t;
      main.appendChild(col);
    }
  }
  for (const q of worksheet.questions || []) {
    const t = THREADS.includes(q.thread) ? q.thread : 1;
    const container = main.querySelector(`.thread[data-thread="${t}"]`);
    let entry = rendered.get(q.id);
    if (!entry) {
      entry = { el: buildQuestion(q), sig: null };
      rendered.set(q.id, entry);
      container.appendChild(entry.el);
    }
    const mine = asks.filter(a => a.question_id === q.id);
    const sig = JSON.stringify([answers[q.id], q.credit, q.correct, q.feedback, mine, q.replies,
                                (q.items || []).map(i => [i.credit, i.correct])]);
    if (sig !== entry.sig) {
      entry.sig = sig;
      updateStatus(q, entry.el, answers[q.id], mine, entry);
    }
    const cardSig = JSON.stringify([q.credit, q.card_proposal, cards[q.id]]);
    if (cardSig !== entry.cardSig) {
      entry.cardSig = cardSig;
      updateCard(q, entry.el, cards[q.id]);
    }
    const gameSig = JSON.stringify([games[q.id], !!q.game, !!q.credit]);
    if (gameSig !== entry.gameSig) {
      // Keep a running game when only the grade changes; reload only for a new version.
      const running = entry.el.querySelector(".game iframe");
      if (!(running && running.dataset.version === games[q.id])) updateGame(q, entry.el, games[q.id]);
      entry.gameSig = gameSig;
    }
  }
  if (worksheet.questions?.length) firstRender = false;
  if (atBottom) scrollTo(0, root.scrollHeight);
}

async function poll() {
  try {
    const res = await fetch("/state", { cache: "no-store" });
    document.getElementById("offline").style.display = "none";
    if (res.ok) render(await res.json());
  } catch {
    document.getElementById("offline").style.display = "block";
  }
}

const suggestToggle = document.getElementById("suggest-toggle");
const suggestPanel = document.getElementById("suggest-panel");
const suggestText = document.getElementById("suggest-text");
const suggestNote = document.getElementById("suggest-note");

suggestToggle.addEventListener("click", () => {
  suggestPanel.hidden = !suggestPanel.hidden;
  suggestToggle.setAttribute("aria-expanded", String(!suggestPanel.hidden));
  if (!suggestPanel.hidden) suggestText.focus();
});

document.getElementById("suggest-form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = suggestText.value.trim();
  if (!text) return;
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  try {
    const res = await fetch("/suggest", { method: "POST", body: JSON.stringify({ text }) });
    if (!res.ok) throw new Error();
    suggestText.value = "";
    suggestNote.textContent = "Sent. The tutor will take it into account.";
  } catch {
    suggestNote.textContent = "Couldn't send. Is the server running?";
  }
  btn.disabled = false;
});

// Ctrl/Cmd+Enter sends; plain Enter makes a new line.
suggestText.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) document.getElementById("suggest-form").requestSubmit();
  if (e.key === "Escape") suggestToggle.click();
});
suggestText.addEventListener("input", () => { suggestNote.textContent = ""; });

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
