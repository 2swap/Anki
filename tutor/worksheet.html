<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worksheet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root { --bg: #fafaf8; --card: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
          --full: #1f8a4c; --partial: #b7791f; --none: #c53030; --accent: #2b59c3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --card: #1f1f22; --ink: #ececec; --muted: #9a9aa0; --line: #333338;
            --full: #48bb78; --partial: #ecc94b; --none: #fc8181; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 56px 20px 120px;
         display: grid; gap: 20px; align-items: start;
         /* A column is never narrower than its widest code line, so code doesn't scroll;
            the other columns shrink to make room. */
         grid-template-columns: repeat(3, minmax(min-content, 1fr)); }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); max-width: 680px; } }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
       padding: 16px 20px; margin-bottom: 16px; }
  .q.new { animation: fadein .4s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
  .prompt > :first-child { margin-top: 0; }
  .prompt > :last-child { margin-bottom: 0; }
  .prompt pre { background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  code { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: .92em; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; width: 0; min-width: 4em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); color: var(--ink); font: inherit; }
  button { padding: 8px 16px; border: 0; border-radius: 6px;
           background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin-top: 10px; }
  .status:empty { display: none; }
  .pending { color: var(--muted); font-style: italic; }
  .card:empty { display: none; }
  .card { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
          font-size: .9rem; color: var(--muted); }
  .card button { padding: 5px 12px; font-size: .85rem; }
  .card .label { color: var(--ink); }
  .card .done { color: var(--full); }
  .card .failed { color: var(--none); }
  .explainer:empty { display: none; }
  .explainer { margin-top: 10px; }
  .explainer video { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .feedback p { display: inline; margin: 0; }
  .feedback.full { border-left: 3px solid var(--full); padding-left: 10px; }
  .feedback.partial { border-left: 3px solid var(--partial); padding-left: 10px; }
  .feedback.none { border-left: 3px solid var(--none); padding-left: 10px; }
  #offline { position: fixed; bottom: 12px; right: 12px; background: var(--none); color: #fff;
             padding: 6px 12px; border-radius: 6px; font-size: .85rem; display: none; }
  #loading { position: fixed; inset: 0; pointer-events: none;
             display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 20px; color: var(--muted); font-style: italic; text-align: center; }
  #loading[hidden] { display: none; }
  #loading .spinner { width: 18px; height: 18px; flex: none; border-radius: 50%;
                      border: 2px solid var(--line); border-top-color: var(--accent);
                      animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loading .spinner { animation: none; } }
  #suggest { position: fixed; top: 12px; right: 12px; z-index: 10;
             display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #suggest-toggle { padding: 6px 12px; font-size: .85rem; }
  #suggest-panel { width: min(360px, calc(100vw - 24px)); background: var(--card);
                   border: 1px solid var(--line); border-radius: 10px; padding: 12px;
                   box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  #suggest-panel[hidden] { display: none; }
  #suggest-panel form { flex-direction: column; margin-top: 0; }
  #suggest-panel textarea { width: 100%; min-height: 110px; resize: vertical; padding: 8px 10px;
                            border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
                            color: var(--ink); font: inherit; font-size: .9rem; }
  #suggest-panel button { align-self: flex-end; }
  #suggest-note { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
<div id="loading" role="status"><span class="spinner"></span>The tutor is writing your first questions…</div>
<main id="questions"></main>
<div id="suggest">
  <button id="suggest-toggle" type="button" aria-expanded="false" aria-controls="suggest-panel">Suggest</button>
  <div id="suggest-panel" hidden>
    <form id="suggest-form">
      <textarea id="suggest-text" maxlength="2000" aria-label="Suggestion for the tutor"
        placeholder="Type here to make suggestions to the tutor. For example, 'Please teach me Arabic!' or 'Within Biology, assume I am a complete beginner, and focus on phylogenetics.'"></textarea>
      <div id="suggest-note"></div>
      <button>Send</button>
    </form>
  </div>
</div>
<div id="offline">Can't reach tutor server</div>
<script>
const rendered = new Map();   // question id -> { el, sig }
const THREADS = [1, 2, 3];

function md(el, text) {
  el.innerHTML = marked.parse(text || "");
  renderMathInElement(el, { delimiters: [
    { left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
    throwOnError: false });
}

function buildQuestion(q) {
  const el = document.createElement("section");
  el.className = "q new";
  el.innerHTML = `<div class="prompt"></div>
                  <form><input autocomplete="off"><button>Submit</button></form>
                  <div class="status"></div>
                  <div class="card"></div>
                  <div class="explainer"></div>`;
  md(el.querySelector(".prompt"), q.prompt);
  el.querySelector("form").addEventListener("submit", e => { e.preventDefault(); submit(q, el); });
  return el;
}

async function submit(q, el) {
  const answer = el.querySelector("input").value;
  if (!answer.trim()) return;
  const btn = el.querySelector("button");
  btn.disabled = true;
  const res = await fetch("/submit", { method: "POST", body: JSON.stringify({ id: q.id, answer }) });
  if (!res.ok) btn.disabled = false;
  poll();
}

function updateStatus(q, el, answer) {
  if (!answer) return;
  const input = el.querySelector("input");
  if (!input.value) input.value = answer.answer;   // restore after a page reload
  input.disabled = true;
  el.querySelector("button").disabled = true;

  const status = el.querySelector(".status");
  if (!q.credit) {
    status.innerHTML = `<div class="pending">Grading…</div>`;
    return;
  }
  status.innerHTML = `<div class="feedback ${q.credit}"></div>`;
  md(status.firstChild, q.feedback);
}

// An Anki card proposal on a graded question. The tutor names the deck and what the
// cards are about; their contents are only written after "Add to Anki" is clicked.
function updateCard(q, el, card) {
  const box = el.querySelector(".card");
  const p = q.card_proposal;
  if (!p || !q.credit) { box.innerHTML = ""; return; }
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = `Anki · ${p.deck}: ${p.label}`;
  box.replaceChildren(label);
  const note = text => { const s = document.createElement("span"); s.textContent = text; box.append(s); return s; };
  if (!card) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Add to Anki";
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        const res = await fetch("/cards/accept", { method: "POST", body: JSON.stringify({ id: q.id }) });
        if (!res.ok) throw new Error((await res.json()).error);
        poll();
      } catch (e) {
        btn.disabled = false;
        note(`Couldn't add: ${e.message || "server unreachable"}`).className = "failed";
      }
    });
    box.append(btn);
  } else if (card.state === "writing") note("Writing cards…").className = "pending";
  else if (card.state === "adding") note("Adding to Anki…").className = "pending";
  else note(card.summary).className = card.state === "done" ? "done" : "failed";
}

function updateExplainer(q, el, state) {
  const box = el.querySelector(".explainer");
  if (state === "rendering") box.innerHTML = `<div class="pending">Rendering animation…</div>`;
  else if (state === "ok") box.innerHTML =
    `<video src="/explainers/${encodeURIComponent(q.id)}.mp4" controls autoplay muted playsinline></video>`;
  else box.innerHTML = "";   // none yet, or the render failed
}

function render({ worksheet, answers, explainers = {}, cards = {} }) {
  // Shown from page load until the tutor has posted its first question.
  document.getElementById("loading").hidden = (worksheet.questions || []).length > 0;
  const main = document.getElementById("questions");
  if (!main.children.length) {
    for (const t of THREADS) {
      const col = document.createElement("div");
      col.className = "thread";
      col.dataset.thread = t;
      main.appendChild(col);
    }
  }
  for (const q of worksheet.questions || []) {
    const t = THREADS.includes(q.thread) ? q.thread : 1;
    const container = main.querySelector(`.thread[data-thread="${t}"]`);
    let entry = rendered.get(q.id);
    if (!entry) {
      entry = { el: buildQuestion(q), sig: null };
      rendered.set(q.id, entry);
      container.appendChild(entry.el);
    }
    const sig = JSON.stringify([answers[q.id], q.credit, q.feedback]);
    if (sig !== entry.sig) {
      entry.sig = sig;
      updateStatus(q, entry.el, answers[q.id]);
    }
    const cardSig = JSON.stringify([q.credit, q.card_proposal, cards[q.id]]);
    if (cardSig !== entry.cardSig) {
      entry.cardSig = cardSig;
      updateCard(q, entry.el, cards[q.id]);
    }
    if (explainers[q.id] !== entry.explainer) {
      entry.explainer = explainers[q.id];
      updateExplainer(q, entry.el, entry.explainer);
    }
  }
}

async function poll() {
  try {
    const res = await fetch("/state", { cache: "no-store" });
    document.getElementById("offline").style.display = "none";
    if (res.ok) render(await res.json());
  } catch {
    document.getElementById("offline").style.display = "block";
  }
}

const suggestToggle = document.getElementById("suggest-toggle");
const suggestPanel = document.getElementById("suggest-panel");
const suggestText = document.getElementById("suggest-text");
const suggestNote = document.getElementById("suggest-note");

suggestToggle.addEventListener("click", () => {
  suggestPanel.hidden = !suggestPanel.hidden;
  suggestToggle.setAttribute("aria-expanded", String(!suggestPanel.hidden));
  if (!suggestPanel.hidden) suggestText.focus();
});

document.getElementById("suggest-form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = suggestText.value.trim();
  if (!text) return;
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  try {
    const res = await fetch("/suggest", { method: "POST", body: JSON.stringify({ text }) });
    if (!res.ok) throw new Error();
    suggestText.value = "";
    suggestNote.textContent = "Sent. The tutor will take it into account.";
  } catch {
    suggestNote.textContent = "Couldn't send. Is the server running?";
  }
  btn.disabled = false;
});

// Ctrl/Cmd+Enter sends; plain Enter makes a new line.
suggestText.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) document.getElementById("suggest-form").requestSubmit();
  if (e.key === "Escape") suggestToggle.click();
});
suggestText.addEventListener("input", () => { suggestNote.textContent = ""; });

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
